<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ทะเบียนออกเลขที่สัญญาจังหวัด</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,"Noto Sans Thai",sans-serif;background:#f5f7fb;color:#1d2939}.top{background:#173b6c;color:#fff;padding:22px 24px}.top h1{margin:0;font-size:28px}.top p{margin:6px 0 0;opacity:.9}.wrap{max-width:1450px;margin:auto;padding:20px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px}.card,.panel{background:#fff;border:1px solid #e4e7ec;border-radius:14px;box-shadow:0 2px 8px #1018280d}.card{padding:16px}.big{font-size:28px;font-weight:700;color:#173b6c}.panel{padding:18px;margin-bottom:16px}.form{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.wide{grid-column:span 2}label{font-size:14px;font-weight:700}input,textarea,select{width:100%;margin-top:6px;padding:10px 11px;border:1px solid #cfd4dc;border-radius:8px;font:inherit;background:#fff}textarea{min-height:76px}.actions{display:flex;gap:8px;align-items:end}.btn{border:0;border-radius:9px;padding:10px 15px;font-weight:700;cursor:pointer}.primary{background:#173b6c;color:#fff}.ghost{background:#eef2f6}.danger{background:#fee4e2;color:#b42318}.bar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}.bar input{max-width:420px;margin:0}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:10px 8px;border-bottom:1px solid #eaecf0;text-align:left;vertical-align:top}th{background:#f8fafc;position:sticky;top:0}.table{overflow:auto;max-height:62vh}.no{font-weight:800;color:#173b6c;white-space:nowrap}.muted{color:#667085}.toast{position:fixed;right:18px;bottom:18px;background:#101828;color:#fff;padding:12px 16px;border-radius:10px;display:none}.mini{padding:6px 9px}.right{text-align:right}@media(max-width:900px){.cards,.form{grid-template-columns:1fr 1fr}.wide{grid-column:span 2}}@media(max-width:600px){.cards,.form{grid-template-columns:1fr}.wide{grid-column:span 1}.top h1{font-size:22px}}
</style></head><body><div class="top"><h1>ทะเบียนออกเลขที่สัญญาจังหวัด</h1><p>กลุ่มงานพัสดุ โรงพยาบาลอุตรดิตถ์</p></div><div class="wrap">
<div class="cards"><div class="card"><div class="muted">ปีงบประมาณ</div><div class="big" id="yearCard">2570</div></div><div class="card"><div class="muted">เลขแนะนำถัดไป</div><div class="big" id="nextNo">—</div></div><div class="card"><div class="muted">จำนวนรายการ</div><div class="big" id="count">0</div></div></div>
<div class="panel"><h3 id="formTitle">เพิ่มรายการออกเลขสัญญา</h3><form id="form" class="form">
<label>ปีงบประมาณ<select id="fy"><option>2570</option></select></label>
<label>เลขที่สัญญา<input id="contract_no" placeholder="เว้นว่างได้ — ระบบจะแสดง รอออกเลข"></label>
<label>ลงวันที่<input id="contract_date" type="date"></label>
<label>เลข Inventory<input id="inventory_no" placeholder="เช่น 69-05132"></label>
<label class="wide">รายการ / เรื่อง *<textarea id="subject" required></textarea></label>
<label class="wide">ผู้ค้า / คู่สัญญา<input id="vendor"></label>
<label>วงเงิน (บาท)<input id="amount" type="number" step="0.01"></label>
<label>ผู้ซื้อ / ผู้รับผิดชอบ<input id="buyer"></label>
<label>แหล่งเงิน<input id="fund_source" placeholder="พิมพ์แหล่งเงิน"></label>
<label class="wide">หมายเหตุ<input id="note"></label>
<div class="actions wide"><button class="btn primary" id="save">บันทึก</button><button type="button" class="btn ghost" id="cancel" style="display:none">ยกเลิกแก้ไข</button></div>
</form></div>
<div class="panel"><div class="bar"><div><b>รายการออกเลขสัญญา</b> <span class="muted" id="status"></span></div><input id="search" placeholder="ค้นหาเลขสัญญา / เรื่อง / ผู้ค้า / Inventory / แหล่งเงิน"></div><div class="table"><table><thead><tr><th>เลขที่สัญญา</th><th>ลงวันที่</th><th>รายการ</th><th>ผู้ค้า</th><th class="right">วงเงิน</th><th>Inventory</th><th>ผู้ซื้อ</th><th>แหล่งเงิน</th><th>จัดการ</th></tr></thead><tbody id="rows"></tbody></table></div></div></div><div class="toast" id="toast"></div>
<script>
const $=id=>document.getElementById(id);let ALL=[],EDIT=null;
function toast(t){$("toast").textContent=t;$("toast").style.display="block";setTimeout(()=>$("toast").style.display="none",2500)}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function money(v){return v==null?"":Number(v).toLocaleString("th-TH",{minimumFractionDigits:2,maximumFractionDigits:2})}
function render(){let q=$("search").value.trim().toLowerCase();let a=ALL.filter(x=>[x.contract_no,x.subject,x.vendor,x.inventory_no,x.buyer,x.fund_source].join(" ").toLowerCase().includes(q));$("rows").innerHTML=a.length?a.map(x=>`<tr><td class="no">${x.contract_no?esc(x.contract_no):"<span class=\"muted\">รอออกเลข</span>"}</td><td>${esc(x.contract_date)}</td><td>${esc(x.subject)}<div class="muted">${esc(x.note)}</div></td><td>${esc(x.vendor)}</td><td class="right">${money(x.amount)}</td><td>${esc(x.inventory_no)}</td><td>${esc(x.buyer)}</td><td>${esc(x.fund_source)}</td><td><button class="btn ghost mini" onclick="editRow('${x.id}')">แก้ไข</button> <button class="btn danger mini" onclick="delRow('${x.id}')">ลบ</button></td></tr>`).join(""):'<tr><td colspan="9" class="muted">ยังไม่มีรายการในปีนี้</td></tr>';$("count").textContent=ALL.length.toLocaleString("th-TH")}
async function load(){let y=$("fy").value;try{let r=await fetch("/api/contracts?year="+y);let j=await r.json();ALL=j.items||[];$("yearCard").textContent=y;$("nextNo").textContent=j.next+"/"+y;if(!EDIT)$("contract_no").placeholder="เช่น "+j.next+"/"+y;render()}catch(e){$("status").textContent="กำลังเชื่อมฐานข้อมูล";render()}}
function editRow(id){let x=ALL.find(v=>v.id===id);if(!x)return;EDIT=id;["contract_no","contract_date","subject","vendor","inventory_no","buyer","fund_source","note"].forEach(k=>$(k).value=x[k]||"");$("amount").value=x.amount??"";$("formTitle").textContent="แก้ไขรายการ "+(x.contract_no||"รอออกเลข");$("cancel").style.display="inline-block";scrollTo({top:120,behavior:"smooth"})}
function reset(){EDIT=null;$("form").reset();$("fy").value=$("yearCard").textContent;$("formTitle").textContent="เพิ่มรายการออกเลขสัญญา";$("cancel").style.display="none"}
async function delRow(id){let x=ALL.find(v=>v.id===id);if(!confirm("ลบรายการ "+(x?.contract_no||"")+" ใช่หรือไม่?"))return;let r=await fetch("/api/contracts/"+id,{method:"DELETE"});if(r.ok){toast("ลบแล้ว");load()}else toast("ลบไม่สำเร็จ")}
$("form").onsubmit=async e=>{e.preventDefault();let b={fiscal_year:Number($("fy").value),contract_no:$("contract_no").value,contract_date:$("contract_date").value,subject:$("subject").value,vendor:$("vendor").value,amount:$("amount").value,inventory_no:$("inventory_no").value,buyer:$("buyer").value,fund_source:$("fund_source").value,note:$("note").value};$("save").disabled=true;try{let r=await fetch(EDIT?"/api/contracts/"+EDIT:"/api/contracts",{method:EDIT?"PUT":"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)});let j=await r.json();if(!r.ok)throw Error(j.error||"บันทึกไม่สำเร็จ");toast(EDIT?"แก้ไขแล้ว":"บันทึกแล้ว");reset();await load()}catch(e){toast(e.message)}finally{$("save").disabled=false}};
$("cancel").onclick=reset;$("fy").onchange=()=>{EDIT=null;$("formTitle").textContent="เพิ่มรายการออกเลขสัญญา";$("cancel").style.display="none";load()};$("search").oninput=render;load();
</script></body></html>
